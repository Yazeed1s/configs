
[terminal.shell]
program = "/bin/zsh"

[env]
TERM = 'xterm-256color'
WINIT_X11_SCALE_FACTOR = "1.45"

[window]
padding = {x = 6,y = 6}
decorations = "None"
opacity = 0.94
resize_increments = false
title = "Alacritty"

[scrolling]
history = 10000
multiplier = 4

[font]
normal = {family = "JetbrainsMono NF", style = "Regular"}
size = 6.5
offset = {x = 1, y = 1}
glyph_offset = {x = 1, y = 1}
builtin_box_drawing = true

[colors]
draw_bold_text_with_bright_colors = true
transparent_background_colors = false

[cursor]
style = {shape = "Underline", blinking = "Never"}

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true

[general]
live_config_reload = true
ipc_socket = true 
import = [
    "~/.config/alacritty/themes/gruvbox_material_hard_dark.toml"
]
